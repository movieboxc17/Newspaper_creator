<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newspaper Creator</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 10px;
            background: #f0f0f0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 100;
        }

        button {
            padding: 10px 20px;
            margin: 0 5px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #0056b3;
        }

        #canvas-container {
            margin-top: 60px;
            width: 100%;
            height: calc(100vh - 120px);
            border: 1px solid #ccc;
            overflow: auto;
        }

        #drawingCanvas {
            width: 100%;
            height: 100%;
            background: white;
        }

        .template-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .template {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .template:hover {
            background: #f5f5f5;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button id="addText">Add Text</button>
        <button id="addImage">Add Image</button>
        <button id="addDrawing">Draw</button>
        <select id="fontSelect">
            <option value="Arial">Arial</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Georgia">Georgia</option>
            <option value="Helvetica">Helvetica</option>
            <option value="Courier New">Courier New</option>
        </select>
        <button id="save">Save</button>
        <button id="load">Load</button>
    </div>
    
    <div id="canvas-container">
        <canvas id="drawingCanvas"></canvas>
    </div>
    
    <div id="templates">
        <h3>Templates</h3>
        <div class="template-grid">
            <div class="template" data-template="classic">Classic</div>
            <div class="template" data-template="modern">Modern</div>
            <div class="template" data-template="magazine">Magazine</div>
        </div>
    </div>

    <script>
        class NewspaperCreator {
            constructor() {
                this.canvas = document.getElementById('drawingCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.setupCanvas();
                this.bindEvents();
                this.currentState = [];
                this.setupLocalStorage();
            }

            setupCanvas() {
                this.canvas.width = window.innerWidth - 40;
                this.canvas.height = window.innerHeight - 140;
                this.ctx.fillStyle = 'white';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            }

            bindEvents() {
                document.getElementById('addText').addEventListener('click', () => this.addText());
                document.getElementById('addImage').addEventListener('click', () => this.addImage());
                document.getElementById('addDrawing').addEventListener('click', () => this.enableDrawing());
                document.getElementById('save').addEventListener('click', () => this.saveState());
                document.getElementById('load').addEventListener('click', () => this.loadState());
                
                window.addEventListener('resize', () => this.handleResize());
            }

            addText() {
                const text = prompt('Enter your text:');
                if (text) {
                    const font = document.getElementById('fontSelect').value;
                    this.ctx.font = `16px ${font}`;
                    this.ctx.fillStyle = 'black';
                    this.ctx.fillText(text, 50, 50);
                    this.saveToHistory();
                }
            }

            addImage() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            this.ctx.drawImage(img, 0, 0, 300, 200);
                            this.saveToHistory();
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                };
                input.click();
            }

            enableDrawing() {
                let isDrawing = false;
                let lastX = 0;
                let lastY = 0;

                this.canvas.onmousedown = (e) => {
                    isDrawing = true;
                    [lastX, lastY] = [e.offsetX, e.offsetY];
                };

                this.canvas.onmousemove = (e) => {
                    if (!isDrawing) return;
                    this.ctx.beginPath();
                    this.ctx.moveTo(lastX, lastY);
                    this.ctx.lineTo(e.offsetX, e.offsetY);
                    this.ctx.stroke();
                    [lastX, lastY] = [e.offsetX, e.offsetY];
                };

                this.canvas.onmouseup = () => {
                    isDrawing = false;
                    this.saveToHistory();
                };

                // Add touch support
                this.canvas.ontouchstart = (e) => {
                    isDrawing = true;
                    const touch = e.touches[0];
                    const rect = this.canvas.getBoundingClientRect();
                    [lastX, lastY] = [touch.clientX - rect.left, touch.clientY - rect.top];
                };

                this.canvas.ontouchmove = (e) => {
                    if (!isDrawing) return;
                    e.preventDefault();
                    const touch = e.touches[0];
                    const rect = this.canvas.getBoundingClientRect();
                    const x = touch.clientX - rect.left;
                    const y = touch.clientY - rect.top;
                    
                    this.ctx.beginPath();
                    this.ctx.moveTo(lastX, lastY);
                    this.ctx.lineTo(x, y);
                    this.ctx.stroke();
                    [lastX, lastY] = [x, y];
                };

                this.canvas.ontouchend = () => {
                    isDrawing = false;
                    this.saveToHistory();
                };
            }

            saveState() {
                const state = this.canvas.toDataURL();
                localStorage.setItem('newspaperState', state);
                alert('State saved successfully!');
            }

            loadState() {
                const state = localStorage.getItem('newspaperState');
                if (state) {
                    const img = new Image();
                    img.onload = () => {
                        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                        this.ctx.drawImage(img, 0, 0);
                    };
                    img.src = state;
                }
            }

            saveToHistory() {
                this.currentState.push(this.canvas.toDataURL());
            }

            handleResize() {
                const tempState = this.canvas.toDataURL();
                this.setupCanvas();
                const img = new Image();
                img.onload = () => {
                    this.ctx.drawImage(img, 0, 0);
                };
                img.src = tempState;
            }

            setupLocalStorage() {
                if (!localStorage.getItem('newspaperState')) {
                    localStorage.setItem('newspaperState', '');
                }
            }
        }

        // Initialize the app
        document.addEventListener('DOMContentLoaded', () => {
            new NewspaperCreator();
        });
    </script>
</body>
</html>
