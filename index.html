<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Newspaper Creator Pro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="workspace">
        <canvas id="drawing-layer"></canvas>
    </div>

    <div class="toolbar">
        <button class="tool-button" id="addText">Add Text</button>
        <button class="tool-button" id="addImage">Add Image</button>
        <button class="tool-button" id="draw">Draw</button>
        <button class="tool-button" id="save">Save</button>
        <button class="tool-button" id="load">Load</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
